services:
  vibephp:
    build:
      context: .
    container_name: vibephp
    restart: unless-stopped
    env_file:
      - ./.env.runtime
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://vibephp.gravy.cc
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "127.0.0.1:18081:8000"
    volumes:
      - vibephp_storage:/app/storage
    read_only: true
    tmpfs:
      - /app/bootstrap/cache:rw,noexec,nosuid,size=16m,uid=33,gid=33,mode=0750
      - /tmp:rw,noexec,nosuid,size=32m,uid=33,gid=33,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  vibephp_storage:
    name: vibephp_storage
